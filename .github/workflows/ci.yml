# Runs the fast suite, lint, the format check and the type check. The area suites (npm run
# test:solver_slow for the solver, test:difficulty_very_slow for the persona corpus) run locally
# after changes in those areas; they aren't part of the green gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Drives ux-checks.html in the runner's preinstalled Chrome. It fails on any
      # unmarked check failure; KNOWN issues are reported but do not fail.
      - run: npm run test:ux
      # The feature list is checked here too, so skipping the pre-push hook with
      # --no-verify cannot hide a hand-edited passing state or a second active feature.
      - run: python3 scripts/features.py check
