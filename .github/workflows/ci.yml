# Runs the fast suite, lint and the format check. The area suites (npm run
# test:solver_slow for the solver, test:difficulty_very_slow for the persona corpus) run locally
# after changes in those areas; they aren't part of the green gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
